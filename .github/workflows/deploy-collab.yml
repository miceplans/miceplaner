name: Deploy collab to Fly.io

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/collaboration/**'
      - 'packages/config/**'
      - 'packages/contracts/**'
      - 'packages/db/**'
      - 'packages/domain/**'
      - 'packages/editor-schema/**'
      - 'packages/knowledge/**'
      - 'packages/queue/**'
      - 'Dockerfile'
      - 'fly.collab.toml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-collab.yml'

permissions:
  contents: read

# 같은 앱에 대한 배포는 순차 실행한다.
concurrency:
  group: deploy-collab
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy (miceplans-collab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only -c fly.collab.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
