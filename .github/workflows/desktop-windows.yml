name: Build Windows desktop app

on:
  workflow_dispatch:
  # 태그 릴리스는 desktop-release.yml이 이 워크플로를 호출해 GitHub Release까지 만든다.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installer
        env:
          # Repository Variables: DESKTOP_API_URL (required), DESKTOP_COLLAB_URL (optional).
          NEXT_PUBLIC_API_URL: ${{ vars.DESKTOP_API_URL }}
          NEXT_PUBLIC_COLLAB_URL: ${{ vars.DESKTOP_COLLAB_URL }}
          # Repository Secrets: 자동 업데이트 패키지 서명 키. 없으면 업데이트 파일 없이 설치 파일만 만든다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @miceplans/desktop build -- --target ${{ matrix.rust_target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MICEPLANNER-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe.sig
