name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installer
        env:
          # Repository Variables: DESKTOP_API_URL (required), DESKTOP_COLLAB_URL (optional).
          NEXT_PUBLIC_API_URL: ${{ vars.DESKTOP_API_URL }}
          NEXT_PUBLIC_COLLAB_URL: ${{ vars.DESKTOP_COLLAB_URL }}
        run: pnpm --filter @miceplans/desktop build -- --target ${{ matrix.rust_target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MICEPLANS-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
