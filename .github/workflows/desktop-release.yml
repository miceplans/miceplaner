name: Release desktop app

# desktop-v<버전> 태그를 push하면 macOS·Windows 설치 파일과 자동 업데이트 파일을 빌드해
# GitHub Release로 공개한다. 설치된 앱은 latest Release의 latest.json을 보고 업데이트한다.
on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches tauri.conf.json version
        run: |
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          conf_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "$tag_version" != "$conf_version" ]; then
            echo "태그 버전($tag_version)과 tauri.conf.json 버전($conf_version)이 다르다." >&2
            exit 1
          fi

      - name: Signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Repository Secret TAURI_SIGNING_PRIVATE_KEY가 없어 업데이트 파일을 서명할 수 없다." >&2
            exit 1
          fi

  macos:
    needs: verify
    uses: ./.github/workflows/desktop-macos.yml
    secrets: inherit

  windows:
    needs: verify
    uses: ./.github/workflows/desktop-windows.yml
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: MICEPLANNER-*
          path: dist
          merge-multiple: true

      - name: Generate latest.json
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          node apps/desktop/scripts/updater-manifest.mjs dist "$version" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          mapfile -t assets < <(find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name 'latest.json' \))
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "MICEPLANNER Desktop $version" \
            --generate-notes \
            --latest
