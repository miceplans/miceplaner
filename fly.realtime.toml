# Socket.IO 실시간 서버. 연결·방 상태를 한 프로세스가 가지므로 단일 머신으로 운영한다(Redis 없음, ADR 참고).
# 배포: fly deploy -c fly.realtime.toml
# 비밀: fly secrets set -c fly.realtime.toml DATABASE_URL=... JWT_SECRET=... REALTIME_INTERNAL_SECRET=... WEB_ORIGIN=https://app.example.com
app = "miceplans-realtime"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"
  build-target = "realtime"

[env]
  NODE_ENV = "production"
  REALTIME_PORT = "3400"
  WORKSPACE_ID = "miceplans"

[http_service]
  internal_port = 3400
  force_https = true
  # 연결이 없을 때 멈추고 요청·연결 시 깨운다. 단일 머신 유지.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
