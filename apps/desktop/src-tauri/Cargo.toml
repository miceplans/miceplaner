[package]
name = "miceplans-desktop"
version = "0.1.0"
description = "MICEPLANNER desktop shell"
authors = ["MICEPLANNER"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "miceplans_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
# tauri.conf.json의 plugins 설정을 generate_context!가 serde_json 값으로 포함한다.
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
