[package]
name = "miceplans-desktop"
version = "0.1.0"
description = "MICEPLANNER desktop shell"
authors = ["MICEPLANNER"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "miceplans_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
