# 위키 협업 서버(Hocuspocus). 단일 머신으로 운영한다(Redis 없음, ADR 참고).
# 배포: fly deploy -c fly.collab.toml
# 비밀: fly secrets set -c fly.collab.toml DATABASE_URL=... JWT_SECRET=... COLLAB_INTERNAL_SECRET=...
app = "miceplans-collab"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"
  build-target = "collab"

[env]
  NODE_ENV = "production"
  COLLAB_PORT = "3300"
  WORKSPACE_ID = "miceplans"

[http_service]
  internal_port = 3300
  force_https = true
  # 연결이 없을 때 멈추고 요청 시 깨워 비용을 줄인다. 단일 머신 유지.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
